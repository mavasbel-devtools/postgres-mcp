[project]
name = "postgres-mcp"
version = "0.1.0"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "mcp==2.3.0",
    "pglast==8.9",
    "psycopg[binary]==3.3.9",
]

[project.scripts]
postgres-mcp = "postgres_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgres_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/component", "tests/e2e"]
# Coverage is enforced on every default run: each tier must fully cover its
# own components, so a drop below 100% fails the run rather than silently
# passing. Use `--no-cov` for quick subset runs.
addopts = "-q --cov=postgres_mcp --cov-config=pyproject.toml --cov-report=term-missing --cov-fail-under=100"
markers = [
    "e2e: end-to-end tests against the full stack (hermetic offline)",
]

[tool.coverage.run]
source = ["postgres_mcp"]
branch = true

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.2.1",
    "ruff==0.14.6",
    "mypy==1.18.1",
    "pytest-bdd==9.0.1",
]
